name: Hosted app checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t pageburrow:test .
      - name: Check container health
        run: |
          docker run -d --name pageburrow -p 10000:10000 -e PUBLIC_ORIGIN=https://pageburrow.example pageburrow:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:10000/healthz
          curl --fail -H 'Host: pageburrow.example' http://localhost:10000/ | grep -q 'Your PDF toolbox, online'
          curl --fail -H 'Host: pageburrow.example' http://localhost:10000/ | grep -q '/large-pdf.js'
          curl --fail --silent --output /dev/null --header 'Host: pageburrow.example' --header 'Accept-Encoding: br' http://localhost:10000/vendor/mupdf-1.28.6/mupdf-wasm.wasm
